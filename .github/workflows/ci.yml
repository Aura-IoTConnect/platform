name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # TimescaleDB's Apache-2.0-only build (no TSL features bundled at all,
        # so it's structurally impossible to depend on a licensed feature by
        # accident) — see CLAUDE.md's "Telemetry storage" section. A fresh
        # ephemeral service container like this one initializes with
        # shared_preload_libraries already set, unlike an existing volume
        # upgraded from plain postgres — see the migration for that path.
        image: timescale/timescaledb:latest-pg16-oss
        env:
          POSTGRES_USER: iotplatform
          POSTGRES_PASSWORD: iotplatform
          POSTGRES_DB: iotplatform
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U iotplatform"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://iotplatform:iotplatform@localhost:5432/iotplatform
      JWT_SECRET: ci-test-secret-do-not-use-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Apply Prisma migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Seed database
        working-directory: apps/api
        # Not `npm run db:seed` — that script hardcodes --env-file=.env, which
        # doesn't exist in CI. Env vars are already injected via job `env:`.
        run: npx tsx prisma/seed.ts

      # Typecheck and lint run before Build so a type error is reported as
      # one, rather than as a failed build.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Node tests (apps/api)
        run: npm test --workspace=apps/api

      - name: Web tests (apps/web)
        run: npm test --workspace=apps/web

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/workers/requirements-dev.txt

      - name: Install Python dependencies
        working-directory: apps/workers
        run: pip install -r requirements-dev.txt

      - name: Python lint (apps/workers)
        working-directory: apps/workers
        run: ruff check app tests scripts

      - name: Python tests (apps/workers)
        working-directory: apps/workers
        run: pytest -v
