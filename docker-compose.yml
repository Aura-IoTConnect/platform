services:
  postgres:
    # TimescaleDB's Apache-2.0-only build — see CLAUDE.md's "Telemetry
    # storage" section. Upgrading an EXISTING volume from plain postgres
    # (not a fresh one) needs a one-time manual step before `npm run
    # db:migrate` will apply cleanly — see that section.
    image: timescale/timescaledb:latest-pg16-oss
    environment:
      POSTGRES_USER: iotplatform
      POSTGRES_PASSWORD: iotplatform
      POSTGRES_DB: iotplatform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf
      # Bind mount (not a named volume) so apps/workers, running natively on
      # the host, can read the plugin's auto-generated bootstrap admin
      # password directly — see mqtt_dynsec.py.
      - ./infra/mosquitto-dynsec-state:/mosquitto/config/dynsec

volumes:
  postgres-data:
