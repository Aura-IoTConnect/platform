listener 1883
allow_anonymous false

# Dynamic security replaces the old static password_file/acl_file — see
# CLAUDE.md's "Per-device MQTT auth" section. State (dynamic-security.json,
# the auto-generated bootstrap admin password) lives in the bind-mounted
# ./infra/mosquitto-dynsec-state/ (gitignored — it's runtime state, not
# committed config), which apps/workers reads directly since it runs
# natively on the host, not inside Docker.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/config/dynsec/dynamic-security.json
